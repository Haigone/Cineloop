name: Build CineLoop Bridge

on:
  pull_request:
    paths: ["tools/cineloop-bridge/**", "extension/icons/32.png"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/cineloop-bridge
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: cineloop-bridge-windows
          path: tools/cineloop-bridge/target/release/cineloop-bridge.exe
