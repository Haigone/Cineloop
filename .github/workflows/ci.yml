name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipi e test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Il build genera i tipi PageProps/LayoutProps che il typecheck richiede.
      # Senza DATABASE_URL usa i dati demo in memoria.
      - run: npm run build
        env:
          DATABASE_URL: ""
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # I due test E2E dell'estensione (extension.spec.ts, extension-prime.spec.ts)
      # sono rossi/in timeout su CI (docs/difetti.md): esclusi finché l'area
      # Estensione non li corregge.
      - run: npm run test:e2e -- --grep-invert "pair the extension|Prime Video is recognised"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
