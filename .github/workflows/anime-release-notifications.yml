name: Anime release notifications

on:
  schedule:
    # 23:00 UTC is midnight in Italy during winter; GitHub schedules use UTC.
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CineLoop release sync
        env:
          CINELOOP_URL: https://cineloop-one.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || (echo "Missing CRON_SECRET repository secret" && exit 1)
          curl --fail --silent --show-error --retry 2 --retry-delay 5             --connect-timeout 15 --max-time 60             -H "Authorization: Bearer $CRON_SECRET"             "$CINELOOP_URL/api/cron/anime-releases"
