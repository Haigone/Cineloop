name: Build CineLoop TV APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "URL HTTPS del sito CineLoop, per esempio https://tuo-dominio.it/tv"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: tv-app
        run: gradle assembleDebug -PcineloopUrl="${{ inputs.site_url }}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cineloop-tv-debug-apk
          path: tv-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
