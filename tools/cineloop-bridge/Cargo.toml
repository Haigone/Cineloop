[package]
name = "cineloop-bridge"
version = "0.1.0"
edition = "2021"
description = "CineLoop Bridge: Discord Rich Presence per l'estensione CineLoop, in background e senza finestre."
license = "UNLICENSED"
publish = false

[lib]
name = "cineloop_bridge"
path = "src/lib.rs"

[[bin]]
name = "cineloop-bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
discord-rich-presence = "1.1.0"
tray-icon = { version = "0.26.1", default-features = false }
tao = { version = "0.37.1", default-features = false }
auto-launch = "0.6"
png = "0.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
